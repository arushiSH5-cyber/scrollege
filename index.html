<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scrollege</title>
<meta name="description" content="Doomscrolling, but you actually pass. Your notes become a feed that fits your brain.">
<meta name="theme-color" content="#cfe6f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Scrollege">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&family=Lexend:wght@400;600&display=swap">
<link rel="stylesheet" href="/src/styles.css">
</head>
<body>
<div class="wrap">
  <div class="phone" role="region" aria-label="Scrollege">
    <div class="screen" id="screen">
      <div class="hdr"><button class="back" id="backBtn" aria-label="Back">←</button><span class="logo"><span id="tm"></span>Scrollege</span>
        <button class="pill" id="breakBtn" aria-label="Need a break?" title="Need a break?">🫧</button><button class="pill" id="themeBtn" aria-label="Switch look: sky, sage or ink night">🎨</button><button class="pill" id="calmBtn" aria-pressed="false" aria-label="Calm mode" title="Calm mode">🍃</button><button class="pill" id="helpBtn" aria-label="Help" title="How it works">?</button></div>
      <div class="deco" id="deco" aria-hidden="true"></div><div class="views" id="views"></div>
      <button class="fab" id="ovBtn" aria-label="I need a break"><span>😮‍💨</span><span class="t"> Need a break?</span></button>
      <nav aria-label="App" id="nav"></nav>
      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
      <div class="tint" id="tint"></div>
      <div class="confetti" id="confetti"></div>
    </div>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
